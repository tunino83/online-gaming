<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ufficio · Carte personaggio</title>
<style>
  body { margin: 0; padding: 24px 16px 48px; background: #f3efe6; color: #2b2620;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .intro { max-width: 1100px; margin: 0 auto 24px; }
  .intro h1 { font-family: Georgia, "Times New Roman", serif; margin: 0 0 6px; font-size: 28px; }
  .intro p { margin: 4px 0; color: #6d655a; font-size: 14px; }
  .griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 28px 20px;
    max-width: 1100px; margin: 0 auto; justify-items: center; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  figcaption { font-size: 12px; color: #6d655a; text-align: center; }
/*
 * Carte del primo gioco. Tutte le misure sono in "em": la dimensione della carta
 * si sceglie impostando la larghezza (--larghezza) e tutto il resto si adatta.
 * Stile: cornice colorata per tipo di potere, punti in alto a destra, illustrazione,
 * codice in tessere bianche sul bordo dell'illustrazione, etichetta e testo del potere.
 */
.carta,
.carta * {
  box-sizing: border-box;
}
.carta {
  --c: #1f4f8f;
  --scuro: #14213d;
  font-size: calc(var(--larghezza, 180px) / 12);
  width: 12em;
  aspect-ratio: 63 / 88;
  position: relative;
  flex: none;
  border-radius: 0.9em;
  padding: 0.3em;
  /* bordo esterno dorato, come le carte numero e i mazzi */
  background: linear-gradient(160deg, #f0d999, #b8892b 45%, #e9cf86 75%, #9a6f20);
  box-shadow: 0 0.15em 0.5em rgb(0 0 0 / 0.3);
  color: var(--scuro);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  text-align: center;
  user-select: none;
}
.carta {
  --sfondo-carta:
    radial-gradient(ellipse at 50% -5%, color-mix(in srgb, var(--c) 20%, transparent), transparent 55%),
    radial-gradient(ellipse at 50% 50%, transparent 55%, rgb(110 70 20 / 0.22) 100%),
    repeating-linear-gradient(45deg, rgb(120 90 40 / 0.04) 0 2px, transparent 2px 6px),
    linear-gradient(170deg, #fbf3de, #f0e0b6);
}
.carta.rosso { --c: #b3261e; }
.carta.speciale { --c: #c08a12; }
.carta.nessuno { --c: #6b7280; }
.carta.misto { --c: #6d3fa0; }

.carta .cornice {
  height: 100%;
  border: 0.32em solid var(--c);
  border-radius: 0.7em;
  /* pergamena: luce del colore del potere in alto, bordi bruniti, trama leggera */
  background: var(--sfondo-carta);
  padding: 0.5em;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}
.carta.misto .cornice {
  border-color: transparent;
  background: var(--sfondo-carta) padding-box, linear-gradient(135deg, #b3261e, #1f4f8f) border-box;
}

.carta .punti {
  position: absolute;
  top: -0.15em;
  right: -0.15em;
  width: 2.5em;
  height: 2.5em;
  border-radius: 50%;
  background: var(--c);
  border: 0.22em solid #fff;
  color: #fff;
  font-weight: 800;
  font-size: 1em;
  display: grid;
  place-items: center;
  box-shadow: 0 0.05em 0.2em rgb(0 0 0 / 0.3);
  z-index: 2;
}
.carta .punti span { font-size: 1.45em; line-height: 1; }
.carta.misto .punti { background: linear-gradient(135deg, #b3261e, #1f4f8f); }

.carta .arte {
  width: 100%;
  height: 7.9em;
  flex: none;
  margin-top: 0.9em;
  border: 0.12em solid var(--scuro);
  border-radius: 0.45em;
  overflow: hidden;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 22%, #fff), color-mix(in srgb, var(--c) 6%, #fff));
}
.carta .arte img { width: 100%; height: 100%; object-fit: cover; }
.carta .arte .simbolo { font-size: 3.4em; line-height: 1; }
.carta .arte .nome { font-size: 0.75em; font-weight: 700; margin-top: 0.2em; padding: 0 0.3em; line-height: 1.1; }
.carta .arte .segnaposto { display: flex; flex-direction: column; align-items: center; padding-bottom: 1.2em; }

.carta .codice {
  margin-top: -1.5em;
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  align-items: center;
  gap: 0.18em;
  max-width: 100%;
  z-index: 1;
}
.carta .tessera {
  min-width: 2.05em;
  height: 2.45em;
  padding: 0 0.15em;
  border-radius: 0.35em;
  border: 0.14em solid var(--scuro);
  background: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 1em;
  box-shadow: 0 0.05em 0.15em rgb(0 0 0 / 0.25);
}
.carta .tessera span { font-size: 1.55em; line-height: 1; font-family: "Cinzel", Georgia, serif; }
.carta .tessera.generica { border-style: dashed; color: #6b7280; }
.carta .tessera.generica span { font-size: 1em; }
.carta .tessera.diamante { color: #1f9bb5; border-color: #1f9bb5; }
.carta .nota {
  font-size: 0.55em;
  font-weight: 700;
  background: #fff;
  border: 0.15em solid var(--scuro);
  border-radius: 99em;
  padding: 0.15em 0.6em;
}
.carta .segno { font-weight: 800; font-size: 0.9em; background: #fff; border-radius: 99em; padding: 0 0.25em; }

.carta .tipo {
  margin-top: 0.45em;
  background: var(--c);
  color: #fff;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-size: 0.74em;
  padding: 0.3em 1em;
  border-radius: 99em;
}
.carta.misto .tipo { background: linear-gradient(135deg, #b3261e, #1f4f8f); }
.carta .testo-potere {
  margin-top: 0.6em;
  font-size: 0.8em;
  line-height: 1.2;
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Versione compatta (carte piccole): niente testo del potere. */
.carta.compatta .testo-potere { display: none; }
.carta.compatta .arte { height: 8.6em; }

/* Carta numero: pergamena con cornice dorata, numero in stile iscrizione (Cinzel) */
.carta.numero {
  background: linear-gradient(160deg, #5a3d17, #2e1e0a);
  padding: 0.28em;
}
.carta.numero .cornice {
  justify-content: center;
  position: relative;
  border: 0.22em solid #c9a24a;
  border-radius: 0.6em;
  background:
    radial-gradient(circle at 50% 42%, rgb(255 250 235 / 0.95), rgb(255 250 235 / 0) 60%),
    radial-gradient(circle at 20% 15%, rgb(150 110 40 / 0.18), transparent 35%),
    radial-gradient(circle at 85% 90%, rgb(150 110 40 / 0.22), transparent 40%),
    linear-gradient(170deg, #f7ebcf, #ead3a1 70%, #dcc086);
  box-shadow: inset 0 0 0 0.15em #f7ebcf, inset 0 0 0 0.3em #8a6420;
}
.carta.numero .cornice::before,
.carta.numero .cornice::after {
  content: "❖";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  color: #a07a2c;
  font-size: 0.9em;
  line-height: 1;
}
.carta.numero .cornice::before { top: 0.3em; }
.carta.numero .cornice::after { bottom: 0.3em; }
/* Carta con le frecce: una grande freccia per lato (su a sinistra, giù a destra), nel colore del numero */
.carta.numero.frecce .valore { font-size: 7.2em; }
.carta.numero.frecce .cornice::before,
.carta.numero.frecce .cornice::after {
  content: "";
  top: 50%;
  bottom: auto;
  width: 1.9em;
  height: 11.5em;
  background: center / contain no-repeat;
}
.carta.numero.frecce .cornice::before { left: 0.7em; transform: translateY(-50%); background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2020%20100%22%20fill%3D%22none%22%20stroke%3D%22%237a5518%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M10%2096V5M2.5%2015L10%205l7.5%2010%22/%3E%3C/svg%3E"); }
.carta.numero.frecce .cornice::after { left: auto; right: 0.7em; transform: translateY(-50%); background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2020%20100%22%20fill%3D%22none%22%20stroke%3D%22%237a5518%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M10%204v91M2.5%2085L10%2095l7.5-10%22/%3E%3C/svg%3E"); }
.carta.numero .valore {
  font-family: "Cinzel", Georgia, serif;
  font-size: 9.5em;
  font-weight: 700;
  line-height: 1;
  color: #3a2208;
  text-shadow: 0 0.03em 0 #fff8e6, 0 0 0.12em rgb(160 122 44 / 0.45);
}
.carta.numero .angolo {
  position: absolute;
  font-family: "Cinzel", Georgia, serif;
  font-size: 1.2em;
  font-weight: 700;
  line-height: 1;
  color: #7a5518;
}
.carta.numero .angolo.alto { top: 0.45em; left: 0.5em; }
.carta.numero .angolo.basso { bottom: 0.45em; right: 0.5em; transform: rotate(180deg); }

/* Dorso dei mazzi coperti: blu notte con stelle e cornice dorata */
.carta.dorso { background: linear-gradient(160deg, #5a3d17, #2e1e0a); }
.carta.dorso .cornice {
  border-color: #c9a24a;
  background:
    radial-gradient(circle at 50% 45%, rgb(201 162 74 / 0.35), transparent 45%),
    repeating-linear-gradient(45deg, rgb(255 255 255 / 0.06) 0 0.5em, transparent 0.5em 1em),
    linear-gradient(160deg, #1f3f73, #0f1a33);
  box-shadow: inset 0 0 0 0.15em #0f1a33, inset 0 0 0 0.28em #c9a24a;
  justify-content: center;
  color: #f7ebcf;
}
.carta.dorso .etichetta-mazzo { font-family: "Cinzel", Georgia, serif; font-size: 1.25em; font-weight: 700; letter-spacing: 0.04em; }
.carta.dorso .conteggio { font-family: "Cinzel", Georgia, serif; font-size: 2.8em; font-weight: 700; line-height: 1.1; color: #f2d58a; }
.carta.dorso.vuoto { opacity: 0.35; }
/* Retro del mazzo personaggi: rosso porpora con un "portale" di cerchi dorati, diverso dal blu a righe dei numeri */
.carta.dorso.personaggi .cornice {
  background:
    radial-gradient(circle at 50% 45%, rgb(242 213 138 / 0.5), transparent 22%),
    repeating-radial-gradient(circle at 50% 45%, rgb(242 213 138 / 0.16) 0 0.18em, transparent 0.18em 0.9em),
    linear-gradient(160deg, #7a1f3d, #2a0b1c);
  box-shadow: inset 0 0 0 0.15em #2a0b1c, inset 0 0 0 0.28em #c9a24a;
}
.carta.dorso.personaggi .etichetta-mazzo::before { content: "✦"; display: block; font-size: 1.6em; color: #f2d58a; line-height: 1; }
.carta.dorso.numeri .etichetta-mazzo::before { content: "1 · 8"; display: block; font-size: 0.8em; color: #f2d58a; opacity: 0.8; }

/* Posto vuoto */
.carta.vuota { background: transparent; box-shadow: none; border: 0.15em dashed rgb(0 0 0 / 0.2); }

/* Carta che si può toccare */
.carta.toccabile { cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease; }
.carta.toccabile { box-shadow: 0 0 0 0.25em #f4b400, 0 0.3em 0.8em rgb(0 0 0 / 0.3); }
.carta.toccabile:hover { transform: translateY(-0.25em); }
.carta.toccabile:active { transform: scale(0.97); }
button.carta { border: none; }
button.carta:disabled { cursor: wait; opacity: 0.7; }

/* Diamanti */
.gettone {
  display: inline-grid;
  place-items: center;
  width: 1.9em;
  height: 1.9em;
  margin: 0.15em;
  font-weight: 800;
  font-size: 0.9rem;
  color: #fff;
  background: linear-gradient(135deg, #3cc4dd, #1f7f95);
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
}
.gettone.fulmine { background: linear-gradient(135deg, #ffd34d, #e39b00); color: #3a2a00; }
.carta.ingrandibile { cursor: zoom-in; }

/* Carta ingrandita sopra tutto */
.velo {
  position: fixed;
  inset: 0;
  z-index: 62;
  background: rgb(0 0 0 / 0.6);
  display: grid;
  place-items: center;
  padding: 16px;
}

/* Codici lunghi (5 o più pezzi): tessere più strette, per stare su una riga */
.carta .codice.lungo { gap: 0.1em; }
.carta .codice.lungo .tessera { min-width: 1.6em; height: 2.15em; padding: 0; }
.carta .codice.lungo .tessera span { font-size: 1.3em; }
.carta .codice.lungo .nota { font-size: 0.45em; padding: 0.15em 0.4em; }
/* 7 o più pezzi (es. Lucciola "333 o 666"): tessere ancora più strette, per restare dentro la carta */
.carta .codice.lunghissimo { gap: 0.06em; }
.carta .codice.lunghissimo .tessera { min-width: 1.25em; height: 1.8em; border-width: 0.1em; border-radius: 0.25em; }
.carta .codice.lunghissimo .tessera span { font-size: 1.05em; }
.carta .codice.lunghissimo .segno { font-size: 0.85em; padding: 0 0.2em; line-height: 1.2; }
.carta .testo-potere.lungo { font-size: 0.66em; -webkit-line-clamp: 6; }

/* Carta scelta per essere scartata */
.carta.selezionata,
.carta.toccabile.selezionata { box-shadow: 0 0 0 0.4em #b3261e, 0 0.3em 0.8em rgb(0 0 0 / 0.3); transform: translateY(-0.4em); }
.carta.selezionata .cornice { opacity: 0.45; }
.carta.selezionata::after {
  content: "✕";
  position: absolute;
  top: -0.6em;
  right: -0.6em;
  width: 3.2em;
  height: 3.2em;
  border-radius: 50%;
  background: #b3261e;
  color: #fff;
  font-weight: 800;
  display: grid;
  place-items: center;
  font-size: 1.3em;
  z-index: 3;
}

/* Carta scelta per un codice */
.carta.scelta,
.carta.toccabile.scelta { box-shadow: 0 0 0 0.4em #1a8f4a, 0 0.3em 0.8em rgb(0 0 0 / 0.3); transform: translateY(-0.4em); }
.carta.scelta::after {
  content: "✓";
  position: absolute;
  top: -0.6em;
  right: -0.6em;
  width: 3.2em;
  height: 3.2em;
  border-radius: 50%;
  background: #1a8f4a;
  color: #fff;
  font-weight: 800;
  display: grid;
  place-items: center;
  font-size: 1.3em;
  z-index: 3;
}

/* Carta che si gira comparendo (primo piano) */
.gira { animation: gira 0.45s ease-out both; perspective: 800px; }
@keyframes gira {
  from { transform: rotateY(90deg) scale(0.8); opacity: 0; }
  to { transform: rotateY(0) scale(1); opacity: 1; }
}
.velo { animation: compare 0.2s ease-out both; }
/* Carosello: la carta nuova entra dal lato verso cui si sfoglia */
.scivola-destra { animation: scivola-destra 0.22s ease-out both; }
.scivola-sinistra { animation: scivola-sinistra 0.22s ease-out both; }
@keyframes scivola-destra { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
@keyframes scivola-sinistra { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
@keyframes compare { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .gira, .velo, .scivola-destra, .scivola-sinistra { animation: none; }
}

/* ---------- Animazione di attivazione ---------- */
.magia-velo {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 45%, rgb(20 16 40 / 0.55), rgb(5 5 15 / 0.85));
  animation: compare 0.25s ease-out both, svanisce 0.35s ease-in 2.45s both;
  cursor: pointer;
}
@keyframes svanisce { to { opacity: 0; } }

/* Alone che ruota dietro la carta */
.magia-alone {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 420px;
  height: 420px;
  margin: -260px 0 0 -210px;
  border-radius: 50%;
  background:
    radial-gradient(circle, color-mix(in srgb, var(--magia) 70%, white) 0%, transparent 55%),
    repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--magia) 55%, transparent) 0deg 10deg, transparent 10deg 30deg);
  filter: blur(2px);
  opacity: 0;
  animation: alone-entra 0.6s ease-out 0.15s forwards, alone-gira 6s linear infinite;
  pointer-events: none;
}
@keyframes alone-entra { from { opacity: 0; transform: scale(0.3); } to { opacity: 0.9; transform: scale(1); } }
@keyframes alone-gira { to { rotate: 360deg; } }

/* La carta compare girandosi e brilla */
.magia-carta {
  position: relative;
  animation: magia-entra 0.7s cubic-bezier(0.2, 1.4, 0.4, 1) both, magia-brilla 1.2s ease-in-out 0.7s infinite alternate;
  border-radius: 1em;
}
@keyframes magia-entra {
  from { transform: perspective(800px) rotateY(180deg) scale(0.3); opacity: 0; }
  to { transform: perspective(800px) rotateY(0) scale(1); opacity: 1; }
}
@keyframes magia-brilla {
  from { filter: drop-shadow(0 0 8px var(--magia)); }
  to { filter: drop-shadow(0 0 28px var(--magia)) brightness(1.08); }
}

/* Scintille che salgono */
.scintilla {
  position: absolute;
  top: 55%;
  left: 50%;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, var(--magia) 60%, transparent 70%);
  opacity: 0;
  animation: scintilla 1.6s ease-out both;
  pointer-events: none;
}
@keyframes scintilla {
  0% { opacity: 0; transform: translate(-50%, 0) scale(0.4); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--x)), -260px) scale(1.2); }
}

.magia-testo { animation: compare 0.4s ease-out 0.5s both; }

@media (prefers-reduced-motion: reduce) {
  .magia-alone, .magia-carta, .scintilla, .magia-testo { animation: none; opacity: 1; }
  .scintilla { display: none; }
}

/* ---------- Mano a ventaglio ---------- */
.ventaglio-carta {
  transform-origin: 50% 100%;
  transform: rotate(var(--r, 0deg)) translateY(var(--y, 0px));
  transition: transform 0.15s ease;
}
.ventaglio-carta:hover,
.ventaglio-carta:focus-within {
  transform: rotate(var(--r, 0deg)) translateY(calc(var(--y, 0px) - 12px));
  z-index: 50 !important;
}

/* Sul mio turno: ciò che non si può toccare è attenuato, così l'occhio va alle mosse possibili */
.mio-turno .carta:not(.toccabile):not(.vuota) { filter: saturate(0.65) brightness(0.82); }

/* Il tipo di potere si riconosce anche da un simbolo, non solo dal colore */
.carta.blu .tipo::before { content: "∞ "; }
.carta.rosso .tipo::before { content: "① "; }
.carta.speciale .tipo::before { content: "✦ "; }
.carta.misto .tipo::before { content: "①∞ "; }

</style>
</head>
<body>
  <div class="intro">
    <h1>Ufficio · Carte personaggio</h1>
    <p>42 personaggi, 55 carte. Generata dai dati del gioco con <code>pnpm carte</code>, con lo stesso stile dell'app.</p>
    <p>Illustrazioni caricate: 0 su 42. Le altre mostrano un simbolo provvisorio e il nome.</p>
  </div>
  <main class="griglia">
    <figure>
      <div class="carta blu" style="--larghezza: 220px" title="Eolo">
        <span class="punti"><span>1</span></span>
        <div class="cornice">
          <div class="arte"><div class="segnaposto"><span class="simbolo" aria-hidden="true">⛏️</span><span class="nome">Eolo</span></div></div>
          <div class="codice "><span class="tessera"><span>1</span></span><span class="tessera"><span>1</span></span></div>
          <span class="tipo">Blu - sempre</span>
          <p class="testo-potere ">Hai a disposizione un 1 per i codici, come se fosse in mano, una volta per turno</p>
        </div>
      </div>
      <figcaption><strong>Eolo</strong> · <code>nano-1</code> · 1 copia</figcaption>
    </figure>
    <figure>
      <div class="carta blu" style="--larghezza: 220px" title="Gongolo">
        <span class="punti"><span>1</span></span>
        <div class="cornice">
          <div class="arte"><div class="segnaposto"><span class="simbolo" aria-hidden="true">⛏️</span><span class="nome">Gongolo</span></div></div>
          <div class="codice "><span class="tessera"><span>2</span></span><span class="tessera"><span>2</span></span></div>
          <span class="tipo">Blu - sempre</span>
          <p class="testo-potere ">Hai un 2 a disposizione, una volta per turno</p>
        </div>
      </div>
      <figcaption><strong>Gongolo</strong> · <code>nano-2</code> · 1 copia</figcaption>
