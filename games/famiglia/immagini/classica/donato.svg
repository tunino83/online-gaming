<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="1000" height="1200">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1035"/>
      <stop offset="1" stop-color="#3a1d5c"/>
    </linearGradient>
    <linearGradient id="fascio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fascioRosa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7ad9" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="palco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a2a"/>
      <stop offset="1" stop-color="#4a2a16"/>
    </linearGradient>
    <linearGradient id="chitarra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8a24a"/>
      <stop offset="1" stop-color="#a5561c"/>
    </linearGradient>
  </defs>

  <!-- sfondo e luci del palco -->
  <rect width="500" height="600" fill="url(#cielo)"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="40" cy="40" r="1.6"/><circle cx="120" cy="25" r="1.2"/><circle cx="420" cy="35" r="1.6"/>
    <circle cx="470" cy="80" r="1.1"/><circle cx="300" cy="18" r="1.3"/><circle cx="70" cy="95" r="1"/>
  </g>
  <rect x="20" y="20" width="460" height="14" rx="4" fill="#2a2a2a"/>
  <g fill="#3a3a3a">
    <rect x="90" y="30" width="26" height="22" rx="4"/><rect x="237" y="30" width="26" height="22" rx="4"/><rect x="384" y="30" width="26" height="22" rx="4"/>
  </g>
  <polygon points="96,52 110,52 230,400 -20,400" fill="url(#fascioRosa)"/>
  <polygon points="243,52 257,52 360,400 140,400" fill="url(#fascio)"/>
  <polygon points="390,52 404,52 520,400 270,400" fill="url(#fascioRosa)"/>

  <!-- palco -->
  <rect x="0" y="395" width="500" height="70" fill="url(#palco)"/>
  <rect x="0" y="392" width="500" height="8" fill="#b07a3e"/>
  <g stroke="#3a2010" stroke-width="2" opacity="0.5">
    <line x1="80" y1="400" x2="60" y2="465"/><line x1="180" y1="400" x2="170" y2="465"/>
    <line x1="320" y1="400" x2="330" y2="465"/><line x1="420" y1="400" x2="440" y2="465"/>
  </g>

  <!-- tastiera sul suo supporto (a destra) -->
  <g>
    <line x1="350" y1="330" x2="330" y2="395" stroke="#222" stroke-width="5"/>
    <line x1="350" y1="330" x2="372" y2="395" stroke="#222" stroke-width="5"/>
    <line x1="430" y1="330" x2="410" y2="395" stroke="#222" stroke-width="5"/>
    <line x1="430" y1="330" x2="452" y2="395" stroke="#222" stroke-width="5"/>
    <rect x="320" y="312" width="140" height="22" rx="4" fill="#1e1e1e"/>
    <rect x="326" y="318" width="128" height="12" fill="#f5f5f5"/>
    <g fill="#111">
      <rect x="333" y="318" width="5" height="7"/><rect x="345" y="318" width="5" height="7"/><rect x="363" y="318" width="5" height="7"/>
      <rect x="375" y="318" width="5" height="7"/><rect x="387" y="318" width="5" height="7"/><rect x="405" y="318" width="5" height="7"/>
      <rect x="417" y="318" width="5" height="7"/><rect x="435" y="318" width="5" height="7"/><rect x="447" y="318" width="5" height="7"/>
    </g>
    <g stroke="#bbb" stroke-width="0.6">
      <line x1="342" y1="318" x2="342" y2="330"/><line x1="358" y1="318" x2="358" y2="330"/><line x1="374" y1="318" x2="374" y2="330"/>
      <line x1="390" y1="318" x2="390" y2="330"/><line x1="406" y1="318" x2="406" y2="330"/><line x1="422" y1="318" x2="422" y2="330"/>
      <line x1="438" y1="318" x2="438" y2="330"/>
    </g>
  </g>

  <!-- asta del microfono -->
  <line x1="205" y1="395" x2="205" y2="190" stroke="#333" stroke-width="4"/>
  <line x1="190" y1="395" x2="220" y2="395" stroke="#333" stroke-width="5"/>
  <line x1="205" y1="190" x2="228" y2="150" stroke="#333" stroke-width="3"/>
  <rect x="224" y="138" width="10" height="16" rx="5" fill="#555" transform="rotate(30 229 146)"/>

  <!-- chitarra a tracolla dietro la schiena -->
  <g transform="rotate(-28 250 230)">
    <rect x="243" y="120" width="12" height="120" fill="#5b3418"/>
    <rect x="239" y="108" width="20" height="18" rx="3" fill="#3a1f0e"/>
    <ellipse cx="249" cy="270" rx="44" ry="52" fill="url(#chitarra)"/>
    <ellipse cx="249" cy="232" rx="32" ry="34" fill="url(#chitarra)"/>
    <circle cx="249" cy="262" r="13" fill="#2b1608"/>
  </g>

  <!-- gambe lunghe e magre -->
  <rect x="236" y="300" width="13" height="96" rx="5" fill="#26324d"/>
  <rect x="255" y="300" width="13" height="96" rx="5" fill="#26324d"/>
  <ellipse cx="238" cy="397" rx="16" ry="6" fill="#111"/>
  <ellipse cx="268" cy="397" rx="16" ry="6" fill="#111"/>

  <!-- corpo alto e magro -->
  <path d="M232 170 Q252 160 272 170 L276 305 L228 305 Z" fill="#c0392b"/>
  <!-- tracolla della chitarra -->
  <line x1="236" y1="172" x2="272" y2="298" stroke="#2b1608" stroke-width="5"/>

  <!-- fisarmonica sul petto -->
  <g>
    <rect x="224" y="222" width="18" height="60" rx="3" fill="#1d1d1d"/>
    <g fill="#f4f4f4"><rect x="227" y="228" width="12" height="4"/><rect x="227" y="236" width="12" height="4"/><rect x="227" y="244" width="12" height="4"/>
      <rect x="227" y="252" width="12" height="4"/><rect x="227" y="260" width="12" height="4"/><rect x="227" y="268" width="12" height="4"/></g>
    <g>
      <rect x="242" y="220" width="6" height="64" fill="#e74c3c"/><rect x="248" y="220" width="6" height="64" fill="#ffffff"/>
      <rect x="254" y="220" width="6" height="64" fill="#e74c3c"/><rect x="260" y="220" width="6" height="64" fill="#ffffff"/>
      <rect x="266" y="220" width="6" height="64" fill="#e74c3c"/>
    </g>
    <rect x="272" y="222" width="16" height="60" rx="3" fill="#1d1d1d"/>
    <g fill="#d4af37"><circle cx="280" cy="232" r="2.2"/><circle cx="280" cy="242" r="2.2"/><circle cx="280" cy="252" r="2.2"/>
      <circle cx="280" cy="262" r="2.2"/><circle cx="280" cy="272" r="2.2"/></g>
  </g>

  <!-- braccia lunghe sulla fisarmonica -->
  <path d="M234 178 Q214 210 228 250" stroke="#e8b48a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M270 178 Q296 210 284 252" stroke="#e8b48a" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- collo e testa -->
  <rect x="246" y="146" width="12" height="18" fill="#e8b48a"/>
  <ellipse cx="252" cy="128" rx="20" ry="24" fill="#f0c29b"/>
  <!-- capelli ricci -->
  <g fill="#2a1a10">
    <circle cx="232" cy="112" r="10"/><circle cx="242" cy="100" r="11"/><circle cx="256" cy="97" r="11"/><circle cx="269" cy="104" r="10"/>
    <circle cx="275" cy="118" r="9"/><circle cx="229" cy="126" r="8"/><circle cx="276" cy="131" r="7"/><circle cx="249" cy="91" r="8"/>
    <circle cx="262" cy="90" r="7"/><circle cx="236" cy="92" r="7"/>
  </g>
  <!-- viso: occhi chiusi, bocca aperta che canta -->
  <path d="M242 128 q4 -3 8 0" stroke="#3b2414" stroke-width="2" fill="none"/>
  <path d="M256 128 q4 -3 8 0" stroke="#3b2414" stroke-width="2" fill="none"/>
  <ellipse cx="254" cy="142" rx="5" ry="6" fill="#7a1f1f"/>

  <!-- note musicali -->
  <g fill="#ffe27a">
    <circle cx="170" cy="120" r="6"/><rect x="175" y="92" width="2.5" height="28"/><path d="M177 92 q10 4 10 14 q-4 -6 -10 -6 z"/>
    <circle cx="320" cy="90" r="5.5"/><circle cx="340" cy="84" r="5.5"/><rect x="324" y="62" width="2.4" height="28"/>
    <rect x="344" y="56" width="2.4" height="28"/><rect x="324" y="58" width="22.4" height="5" transform="rotate(-14 335 60)"/>
  </g>

  <!-- folla che balla sotto il palco -->
  <rect x="0" y="465" width="500" height="135" fill="#140a26"/>
  <g>
    <g fill="#e67e22"><circle cx="40" cy="500" r="16"/><path d="M18 600 Q22 525 40 520 Q58 525 62 600 Z"/><line x1="26" y1="530" x2="8" y2="478" stroke="#e67e22" stroke-width="8" stroke-linecap="round"/><line x1="54" y1="530" x2="70" y2="482" stroke="#e67e22" stroke-width="8" stroke-linecap="round"/></g>
    <g fill="#27ae60"><circle cx="105" cy="515" r="15"/><path d="M84 600 Q88 540 105 535 Q122 540 126 600 Z"/><line x1="92" y1="545" x2="80" y2="495" stroke="#27ae60" stroke-width="8" stroke-linecap="round"/></g>
    <g fill="#2980b9"><circle cx="170" cy="497" r="17"/><path d="M146 600 Q150 520 170 516 Q190 520 194 600 Z"/><line x1="156" y1="528" x2="140" y2="474" stroke="#2980b9" stroke-width="8" stroke-linecap="round"/><line x1="184" y1="528" x2="200" y2="474" stroke="#2980b9" stroke-width="8" stroke-linecap="round"/></g>
    <g fill="#f1c40f"><circle cx="240" cy="512" r="15"/><path d="M219 600 Q223 536 240 532 Q257 536 261 600 Z"/><line x1="254" y1="542" x2="272" y2="498" stroke="#f1c40f" stroke-width="8" stroke-linecap="round"/></g>
    <g fill="#8e44ad"><circle cx="310" cy="500" r="16"/><path d="M288 600 Q292 522 310 518 Q328 522 332 600 Z"/><line x1="296" y1="530" x2="282" y2="478" stroke="#8e44ad" stroke-width="8" stroke-linecap="round"/><line x1="324" y1="530" x2="340" y2="478" stroke="#8e44ad" stroke-width="8" stroke-linecap="round"/></g>
    <g fill="#e74c3c"><circle cx="380" cy="516" r="15"/><path d="M359 600 Q363 540 380 536 Q397 540 401 600 Z"/><line x1="366" y1="546" x2="352" y2="500" stroke="#e74c3c" stroke-width="8" stroke-linecap="round"/></g>
    <g fill="#1abc9c"><circle cx="452" cy="502" r="16"/><path d="M430 600 Q434 524 452 520 Q470 524 474 600 Z"/><line x1="438" y1="532" x2="424" y2="480" stroke="#1abc9c" stroke-width="8" stroke-linecap="round"/><line x1="466" y1="532" x2="484" y2="480" stroke="#1abc9c" stroke-width="8" stroke-linecap="round"/></g>
  </g>
</svg>
